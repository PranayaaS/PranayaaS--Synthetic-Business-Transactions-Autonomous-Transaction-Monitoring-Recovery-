{% extends "base.html" %}
{% block body %}
<div class="card narrow">
  <h1>Sign in</h1>
  <div class="muted">Internet banking for members</div>
  {% if error %}<div class="err" id="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Username<input id="username" name="username" autocomplete="username"></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password"></label>
    <button id="login-btn" type="submit" class="btn block">Login</button>
  </form>
  <div class="hint">Demo credentials: <b>demo</b> / <b>demo123</b></div>
</div>
{% endblock %}
