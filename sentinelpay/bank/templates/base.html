<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DDCCB Internet Banking{% endblock %}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f1f5f9;color:#1e293b}
  a{color:inherit}
  .top{background:#065f46;color:#fff}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  .top .wrap{height:56px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none}
  .brand .logo{width:28px;height:28px;border-radius:6px;background:#10b981;display:grid;place-items:center;font-weight:700}
  .nav{font-size:12px;color:#d1fae5;display:flex;gap:14px;align-items:center}
  .notice{background:#fef3c7;border-bottom:1px solid #fcd34d;color:#78350f}
  .notice .wrap{padding:10px 16px;font-size:14px;display:flex;gap:8px;align-items:center}
  main{padding:32px 0}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px}
  .narrow{max-width:420px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px}
  .muted{color:#64748b;font-size:14px}
  .small{font-size:12px}
  label{display:block;font-size:14px;margin-top:12px}
  input,select{display:block;width:100%;margin-top:4px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px;background:#fff}
  .btn{display:inline-flex;align-items:center;gap:6px;background:#047857;color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn:hover{background:#065f46}
  .btn.block{width:100%;justify-content:center;margin-top:16px}
  .err{margin-top:12px;background:#fef2f2;color:#b91c1c;border-radius:6px;padding:8px 10px;font-size:14px}
  .hint{margin-top:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;font-size:12px;color:#475569}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  .bal{font-size:32px;font-weight:700;margin-top:4px}
  .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #f1f5f9}
  .center{text-align:center}
  .big{font-size:34px;font-weight:700;margin-top:10px}
  .ok{color:#059669}.warn{color:#d97706}
  .icon{font-size:44px;line-height:1}
  .hidden{display:none}
  footer{text-align:center;font-size:12px;color:#94a3b8;padding-bottom:24px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a href="/dashboard" class="brand"><span class="logo">D</span> DDCCB Co-operative Bank</a>
    <div class="nav"><span>Mock bank &middot; demo only</span>{% block nav %}{% endblock %}</div>
  </div>
</header>
{% for n in notices or [] %}
<div class="notice customer-notice"><div class="wrap">&#128226; {{ n.text }}</div></div>
{% endfor %}
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
<footer>Simulated bank for the SentinelPay demo. No real money moves.</footer>
</body>
</html>
